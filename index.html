<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --bg2: #edecea;
  --bg3: #e4e2de;
  --card: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.13);
  --text: #1a1917;
  --text2: #6b6962;
  --text3: #9a9890;
  --up: #1a7a4a;
  --up-bg: #e6f5ec;
  --down: #c0392b;
  --down-bg: #fdecea;
  --flat: #6b6962;
  --flat-bg: #f0eeeb;
  --accent: #1a1917;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans SC', sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412;
    --bg2: #1c1b19;
    --bg3: #242320;
    --card: #1e1d1b;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0eeea;
    --text2: #8a8880;
    --text3: #5a5855;
    --up: #2ecc71;
    --up-bg: #0d2b1a;
    --down: #e74c3c;
    --down-bg: #2b0d0d;
    --flat: #8a8880;
    --flat-bg: #242320;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

/* Layout */
.app { display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.logo span { font-weight: 300; color: var(--text2); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.nav { display: flex; gap: 4px; }
.nav-btn { padding: 6px 14px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); font-family: var(--sans); font-size: 13px; cursor: pointer; transition: all 0.15s; }
.nav-btn:hover { background: var(--bg2); color: var(--text); }
.nav-btn.active { background: var(--text); color: var(--bg); }
.refresh-ctrl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text3); }
.refresh-ctrl select { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); font-size: 12px; padding: 4px 8px; border-radius: 6px; outline: none; cursor: pointer; }
.refresh-indicator { width: 7px; height: 7px; border-radius: 50%; background: var(--up); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.last-update { font-family: var(--mono); font-size: 11px; color: var(--text3); }
.main { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 24px 24px; }

/* Pages */
.page { display: none; }
.page.active { display: block; }

/* Section */
.section { margin-bottom: 28px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.section-action { font-size: 12px; color: var(--text3); cursor: pointer; border: none; background: none; font-family: var(--sans); }
.section-action:hover { color: var(--text2); }

/* Index cards grid */
.index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.index-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: all 0.15s; }
.index-card:hover { border-color: var(--border2); transform: translateY(-1px); box-shadow: var(--shadow); }
.index-name { font-size: 12px; color: var(--text2); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.index-value { font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.index-change { display: flex; gap: 8px; align-items: center; }
.change-pct { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.change-pt { font-family: var(--mono); font-size: 11px; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat-color { color: var(--flat); }
.tag-up { background: var(--up-bg); color: var(--up); font-size: 11px; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-weight: 500; }
.tag-down { background: var(--down-bg); color: var(--down); font-size: 11px; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-weight: 500; }
.tag-flat { background: var(--flat-bg); color: var(--flat); font-size: 11px; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); }
.mini-chart { height: 36px; width: 100%; margin-top: 8px; }
.mini-chart canvas { width: 100% !important; height: 36px !important; }

/* Stock table */
.stock-table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.stock-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.stock-table th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); background: var(--bg2); }
.stock-table th.r, .stock-table td.r { text-align: right; }
.stock-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
.stock-table tr:last-child td { border-bottom: none; }
.stock-table tr:hover td { background: var(--bg2); }
.stock-code { font-family: var(--mono); font-size: 11px; color: var(--text3); }
.stock-name { font-weight: 500; font-size: 13px; }
.mono { font-family: var(--mono); }
.stock-actions { display: flex; gap: 6px; justify-content: flex-end; }
.btn-sm { padding: 3px 10px; border-radius: 5px; border: 1px solid var(--border2); background: transparent; font-size: 11px; color: var(--text2); cursor: pointer; font-family: var(--sans); transition: all 0.12s; }
.btn-sm:hover { background: var(--bg3); color: var(--text); }
.btn-sm.danger:hover { background: var(--down-bg); color: var(--down); border-color: var(--down); }

/* Watchlist add form */
.add-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.add-bar input { flex: 1; background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 14px; font-family: var(--sans); font-size: 13px; color: var(--text); outline: none; transition: border 0.15s; }
.add-bar input:focus { border-color: var(--text3); }
.add-bar input::placeholder { color: var(--text3); }
.btn-primary { padding: 9px 18px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
.btn-primary:hover { opacity: 0.8; }
.btn-secondary { padding: 9px 14px; background: var(--bg2); color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: var(--sans); font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn-secondary:hover { background: var(--bg3); }
.search-results { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.search-result-item { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); transition: background 0.1s; }
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--bg2); }
.market-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border2); color: var(--text3); font-family: var(--mono); }

/* Group tabs */
.group-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.group-tab { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--sans); transition: all 0.12s; }
.group-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.group-tab:hover:not(.active) { background: var(--bg2); }

/* Portfolio summary */
.portfolio-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
.summary-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.summary-value { font-family: var(--mono); font-size: 17px; font-weight: 500; }

/* Heatmap */
.heatmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
.heatmap-cell { border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; cursor: pointer; transition: filter 0.15s; }
.heatmap-cell:hover { filter: brightness(0.9); }
.heatmap-cell .cell-name { font-size: 11px; font-weight: 500; margin-bottom: 3px; }
.heatmap-cell .cell-pct { font-family: var(--mono); font-size: 12px; font-weight: 500; }

/* FX */
.fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.fx-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.fx-pair { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-family: var(--mono); }
.fx-rate { font-family: var(--mono); font-size: 22px; font-weight: 500; margin-bottom: 4px; }
.fx-conv { margin-top: 10px; display: flex; gap: 6px; align-items: center; }
.fx-input { width: 80px; background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; font-family: var(--mono); font-size: 12px; color: var(--text); outline: none; }
.fx-result { font-family: var(--mono); font-size: 12px; color: var(--text2); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 999; transition: transform 0.25s; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 400px; max-width: 95vw; border: 1px solid var(--border2); }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.form-row { margin-bottom: 12px; }
.form-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; }
.form-input { width: 100%; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 12px; font-family: var(--mono); font-size: 13px; color: var(--text); outline: none; }
.form-input:focus { border-color: var(--text3); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Sparkline helper */
.sparkline { display: inline-block; }

/* Rankings */
.rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rank-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.rank-header { padding: 10px 14px; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; background: var(--bg2); border-bottom: 1px solid var(--border); }
.rank-item { display: flex; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); gap: 10px; }
.rank-item:last-child { border-bottom: none; }
.rank-num { font-family: var(--mono); font-size: 11px; color: var(--text3); width: 16px; }
.rank-info { flex: 1; min-width: 0; }
.rank-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-code { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.rank-pct { font-family: var(--mono); font-size: 13px; font-weight: 500; }

/* Empty state */
.empty { text-align: center; padding: 48px 24px; color: var(--text3); font-size: 13px; }
.empty-icon { font-size: 32px; margin-bottom: 12px; }

/* Loader */
.loading-row td { text-align: center; padding: 24px; color: var(--text3); font-size: 12px; }

/* Responsive */
@media (max-width: 640px) {
  .topbar { padding: 0 14px; }
  .main { padding: 14px; }
  .rank-grid { grid-template-columns: 1fr; }
  .nav-btn { padding: 5px 10px; font-size: 12px; }
  .index-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">行情<span>中心</span></div>
      <nav class="nav">
        <button class="nav-btn active" onclick="switchPage('market')">大盘</button>
        <button class="nav-btn" onclick="switchPage('watchlist')">自选</button>
        <button class="nav-btn" onclick="switchPage('portfolio')">持仓</button>
        <button class="nav-btn" onclick="switchPage('rank')">榜单</button>
        <button class="nav-btn" onclick="switchPage('fx')">汇率</button>
      </nav>
    </div>
    <div class="topbar-right">
      <div class="refresh-ctrl">
        <div class="refresh-indicator" id="refreshDot"></div>
        <select id="refreshInterval" onchange="setRefreshInterval()">
          <option value="0">不刷新</option>
          <option value="30">30秒</option>
          <option value="60" selected>1分钟</option>
          <option value="300">5分钟</option>
        </select>
        <span class="last-update" id="lastUpdate">--:--:--</span>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 大盘 -->
    <div id="page-market" class="page active">
      <div class="section">
        <div class="section-header"><span class="section-title">🇨🇳 A股指数</span></div>
        <div class="index-grid" id="cn-indices"></div>
      </div>
      <div class="section">
        <div class="section-header"><span class="section-title">🇺🇸 美股指数</span></div>
        <div class="index-grid" id="us-indices"></div>
      </div>
      <div class="section">
        <div class="section-header"><span class="section-title">🌏 全球市场</span></div>
        <div class="index-grid" id="global-indices"></div>
      </div>
      <div class="section">
        <div class="section-header"><span class="section-title">📊 A股板块热力图</span></div>
        <div class="heatmap-grid" id="heatmap"></div>
      </div>
    </div>

    <!-- 自选 -->
    <div id="page-watchlist" class="page">
      <div class="add-bar">
        <input type="text" id="searchInput" placeholder="搜索股票代码或名称，如 AAPL / 贵州茅台 / 000001" oninput="handleSearch()" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-primary" onclick="doSearch()">搜索</button>
      </div>
      <div id="searchResults" style="display:none;"></div>
      <div class="group-tabs" id="groupTabs"></div>
      <div class="stock-table-wrap">
        <table class="stock-table">
          <thead>
            <tr>
              <th>名称</th>
              <th class="r">最新价</th>
              <th class="r">涨跌幅</th>
              <th class="r">涨跌额</th>
              <th class="r">成交量</th>
              <th class="r">操作</th>
            </tr>
          </thead>
          <tbody id="watchlistBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 持仓 -->
    <div id="page-portfolio" class="page">
      <div class="portfolio-summary" id="portfolioSummary"></div>
      <div class="section-header" style="margin-bottom:12px;">
        <span class="section-title">持仓明细</span>
        <button class="btn-primary" onclick="openAddPosition()">+ 新增持仓</button>
      </div>
      <div class="stock-table-wrap">
        <table class="stock-table">
          <thead>
            <tr>
              <th>名称</th>
              <th class="r">现价</th>
              <th class="r">成本价</th>
              <th class="r">持仓量</th>
              <th class="r">市值</th>
              <th class="r">盈亏</th>
              <th class="r">盈亏%</th>
              <th class="r">操作</th>
            </tr>
          </thead>
          <tbody id="portfolioBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 榜单 -->
    <div id="page-rank" class="page">
      <div class="rank-grid" id="rankGrid"></div>
    </div>

    <!-- 汇率 -->
    <div id="page-fx" class="page">
      <div class="section">
        <div class="section-header"><span class="section-title">实时汇率</span></div>
        <div class="fx-grid" id="fxGrid"></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox">
    <div class="modal-title" id="modalTitle">新增持仓</div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== DATA STORE ====================
const STORAGE_KEY = 'stockdash_v2';
let store = {
  watchlist: [],
  portfolio: [],
  groups: ['全部', '科技', '金融', '消费', '基金', '美股'],
};

function loadStore() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) store = { ...store, ...JSON.parse(s) };
  } catch(e) {}
}
function saveStore() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}
loadStore();

// ==================== MOCK DATA ENGINE ====================
// Simulates real market data with realistic values
const BASE_DATA = {
  // CN Indices
  'SH000001': { name: '上证指数', base: 3281.47, market: 'CN' },
  'SZ399001': { name: '深证成指', base: 9842.33, market: 'CN' },
  'SZ399006': { name: '创业板指', base: 1923.56, market: 'CN' },
  'SH000688': { name: '科创50',   base: 987.44,  market: 'CN' },
  // US Indices
  'DJIA':    { name: '道琼斯',   base: 39127.14, market: 'US' },
  'NASDAQ':  { name: '纳斯达克', base: 16340.87, market: 'US' },
  'SP500':   { name: '标普500',  base: 5205.81,  market: 'US' },
  'VIX':     { name: 'VIX恐慌',  base: 15.42,    market: 'US' },
  // Global
  'HSI':     { name: '恒生指数', base: 17284.54, market: 'HK' },
  'N225':    { name: '日经225',  base: 39523.52, market: 'JP' },
  'GOLD':    { name: '黄金(USD)', base: 2336.40, market: 'COM' },
  'OIL':     { name: '原油(USD)', base: 83.12,   market: 'COM' },
  // Stocks
  'AAPL':   { name: 'Apple',     base: 189.30, market: 'US' },
  'MSFT':   { name: 'Microsoft', base: 417.88, market: 'US' },
  'NVDA':   { name: 'NVIDIA',    base: 887.55, market: 'US' },
  'TSLA':   { name: 'Tesla',     base: 171.05, market: 'US' },
  'GOOGL':  { name: 'Alphabet',  base: 175.42, market: 'US' },
  'META':   { name: 'Meta',      base: 513.60, market: 'US' },
  'AMZN':   { name: 'Amazon',    base: 183.75, market: 'US' },
  'SH600519': { name: '贵州茅台', base: 1698.00, market: 'CN' },
  'SH601318': { name: '中国平安', base: 44.55,   market: 'CN' },
  'SZ000858': { name: '五粮液',   base: 139.60,  market: 'CN' },
  'SH600036': { name: '招商银行', base: 35.22,   market: 'CN' },
  'SZ300750': { name: '宁德时代', base: 178.40,  market: 'CN' },
  'SH600900': { name: '长江电力', base: 27.13,   market: 'CN' },
  'SZ002714': { name: '牧原股份', base: 42.88,   market: 'CN' },
  '510300':  { name: '沪深300ETF', base: 3.957, market: 'FUND' },
  '510050':  { name: '上证50ETF',  base: 2.741, market: 'FUND' },
  '159915':  { name: '创业板ETF',  base: 1.512, market: 'FUND' },
};

// Per-session random seeds
const SESSION_SEED = Date.now();
function seededRand(sym, t) {
  let h = 0;
  for (let i = 0; i < sym.length; i++) h = (Math.imul(31, h) + sym.charCodeAt(i)) | 0;
  h ^= SESSION_SEED;
  const x = Math.sin(h + t * 137.5) * 10000;
  return x - Math.floor(x);
}
function getPrice(sym) {
  const d = BASE_DATA[sym];
  if (!d) return null;
  const t = Math.floor(Date.now() / 30000);
  const r1 = seededRand(sym, t);
  const r2 = seededRand(sym, t - 1);
  const r3 = seededRand(sym, 0);
  const dailyChange = (r3 - 0.5) * 0.06 * d.base;
  const noise = (r1 - 0.5) * 0.008 * d.base;
  const price = d.base + dailyChange + noise;
  const prevClose = d.base + (r2 - 0.5) * 0.003 * d.base;
  const change = price - (d.base + (seededRand(sym, -1) - 0.5) * 0.06 * d.base);
  const pct = (change / (d.base)) * 100;
  const history = [];
  for (let i = 20; i >= 0; i--) {
    const rh = seededRand(sym, t - i);
    history.push(d.base + dailyChange * (1 - i/25) + (rh - 0.5) * 0.004 * d.base);
  }
  return { price: +price.toFixed(price > 100 ? 2 : price > 10 ? 3 : 4),
           change: +change.toFixed(price > 100 ? 2 : 3),
           pct: +pct.toFixed(2), history, name: d.name, market: d.market };
}

function fmt(n, decimals=2) {
  if (n === undefined || n === null) return '--';
  return n.toLocaleString('zh-CN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtVol(n) {
  if (!n) return '--';
  if (n >= 1e8) return (n/1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n/1e4).toFixed(2) + '万';
  return n.toString();
}
function changeClass(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat-color'; }
function changeTag(v, s) { 
  if (v > 0) return `<span class="tag-up">+${s}</span>`;
  if (v < 0) return `<span class="tag-down">${s}</span>`;
  return `<span class="tag-flat">${s}</span>`;
}

// Sparkline
function drawSparkline(canvas, data, isUp) {
  if (!canvas || !data || data.length < 2) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.offsetWidth || 120, h = 36;
  canvas.width = w * window.devicePixelRatio;
  canvas.height = h * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  ctx.clearRect(0, 0, w, h);
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => [i / (data.length-1) * w, h - (v - min) / range * (h-4) - 2]);
  const color = isUp ? '#1a7a4a' : '#c0392b';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Fill
  ctx.lineTo(pts[pts.length-1][0], h);
  ctx.lineTo(pts[0][0], h);
  ctx.closePath();
  ctx.fillStyle = isUp ? 'rgba(26,122,74,0.1)' : 'rgba(192,57,43,0.1)';
  ctx.fill();
}

// ==================== MARKET PAGE ====================
function renderMarket() {
  const cnSyms  = ['SH000001','SZ399001','SZ399006','SH000688'];
  const usSyms  = ['DJIA','NASDAQ','SP500','VIX'];
  const glbSyms = ['HSI','N225','GOLD','OIL'];

  function renderIndexGrid(containerId, syms) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    syms.forEach(sym => {
      const d = getPrice(sym);
      if (!d) return;
      const sign = d.pct >= 0 ? '+' : '';
      const cls = changeClass(d.pct);
      const card = document.createElement('div');
      card.className = 'index-card';
      card.innerHTML = `
        <div class="index-name">${d.name}</div>
        <div class="index-value ${cls}">${fmt(d.price)}</div>
        <div class="index-change">
          ${changeTag(d.pct, sign + d.pct.toFixed(2) + '%')}
          <span class="change-pt ${cls}">${sign}${fmt(d.change)}</span>
        </div>
        <div class="mini-chart"><canvas id="spark-${sym}"></canvas></div>`;
      el.appendChild(card);
      requestAnimationFrame(() => {
        const canvas = document.getElementById('spark-' + sym);
        if (canvas) drawSparkline(canvas, d.history, d.pct >= 0);
      });
    });
  }
  renderIndexGrid('cn-indices', cnSyms);
  renderIndexGrid('us-indices', usSyms);
  renderIndexGrid('global-indices', glbSyms);
  renderHeatmap();
}

const SECTORS = [
  { name: '银行', seed: 1 }, { name: '地产', seed: 2 }, { name: '医药', seed: 3 },
  { name: '食品饮料', seed: 4 }, { name: '新能源', seed: 5 }, { name: '半导体', seed: 6 },
  { name: '汽车', seed: 7 }, { name: '消费电子', seed: 8 }, { name: '军工', seed: 9 },
  { name: '钢铁', seed: 10 }, { name: '有色金属', seed: 11 }, { name: '化工', seed: 12 },
  { name: '传媒', seed: 13 }, { name: '计算机', seed: 14 }, { name: '农林牧渔', seed: 15 },
  { name: '交运', seed: 16 },
];
function renderHeatmap() {
  const el = document.getElementById('heatmap');
  if (!el) return;
  const t = Math.floor(Date.now() / 30000);
  el.innerHTML = SECTORS.map(s => {
    const r = seededRand('sector' + s.seed, t);
    const pct = (r - 0.5) * 8;
    const intensity = Math.min(Math.abs(pct) / 4, 1);
    let bg, textColor;
    if (pct > 0) {
      const g = Math.round(122 + (78 - 122) * (1 - intensity));
      bg = `rgba(26,${g},74,${0.15 + intensity * 0.6})`;
      textColor = pct > 1.5 ? '#0d5c35' : '#1a7a4a';
    } else {
      const r2 = Math.round(57 + (180 - 57) * (1 - intensity));
      bg = `rgba(192,${r2},43,${0.15 + intensity * 0.6})`;
      textColor = Math.abs(pct) > 1.5 ? '#7a1a1a' : '#c0392b';
    }
    return `<div class="heatmap-cell" style="background:${bg}">
      <div class="cell-name" style="color:${textColor}">${s.name}</div>
      <div class="cell-pct" style="color:${textColor}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</div>
    </div>`;
  }).join('');
}

// ==================== WATCHLIST PAGE ====================
const SEARCH_DB = Object.entries(BASE_DATA).map(([sym, d]) => ({ sym, ...d }));

let searchTimeout;
function handleSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 300);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const el = document.getElementById('searchResults');
  if (!q) { el.style.display = 'none'; return; }
  const results = SEARCH_DB.filter(s =>
    s.sym.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)
  ).slice(0, 8);
  if (!results.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<div class="search-results">' + results.map(r => `
    <div class="search-result-item" onclick="addToWatchlist('${r.sym}')">
      <div>
        <div style="font-size:13px;font-weight:500;">${r.name}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--text3);">${r.sym}</div>
      </div>
      <span class="market-tag">${r.market}</span>
    </div>`).join('') + '</div>';
}

function addToWatchlist(sym) {
  if (store.watchlist.find(w => w.sym === sym)) { showToast('已在自选列表中'); return; }
  const d = BASE_DATA[sym];
  if (!d) return;
  store.watchlist.push({ sym, name: d.name, group: '全部', addedAt: Date.now() });
  saveStore();
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
  renderWatchlist();
  showToast('已添加 ' + d.name);
}

let activeGroup = '全部';
function renderWatchlist() {
  // Group tabs
  const tabs = document.getElementById('groupTabs');
  tabs.innerHTML = ['全部', ...store.groups.filter(g => g !== '全部')].map(g =>
    `<button class="group-tab ${g === activeGroup ? 'active' : ''}" onclick="switchGroup('${g}')">${g}</button>`
  ).join('');

  const body = document.getElementById('watchlistBody');
  const items = activeGroup === '全部' ? store.watchlist : store.watchlist.filter(w => w.group === activeGroup);
  if (!items.length) {
    body.innerHTML = `<tr><td colspan="6" class="loading-row">暂无自选股 — 在上方搜索并添加</td></tr>`;
    return;
  }
  body.innerHTML = items.map(w => {
    const d = getPrice(w.sym);
    if (!d) return '';
    const sign = d.pct >= 0 ? '+' : '';
    return `<tr>
      <td><div class="stock-name">${w.name}</div><div class="stock-code">${w.sym}</div></td>
      <td class="r mono">${fmt(d.price)}</td>
      <td class="r"><span class="${d.pct >= 0 ? 'tag-up' : 'tag-down'}">${sign}${d.pct.toFixed(2)}%</span></td>
      <td class="r mono ${changeClass(d.change)}">${sign}${fmt(d.change)}</td>
      <td class="r mono" style="color:var(--text2)">${fmtVol(Math.round(d.price * (seededRand(w.sym,1)*5e6+1e6)))}</td>
      <td class="r"><div class="stock-actions">
        <select class="btn-sm" onchange="changeGroup('${w.sym}',this.value)" style="cursor:pointer;">
          ${store.groups.map(g=>`<option ${w.group===g?'selected':''} value="${g}">${g}</option>`).join('')}
        </select>
        <button class="btn-sm danger" onclick="removeWatchlist('${w.sym}')">删除</button>
      </div></td>
    </tr>`;
  }).join('');
}

function switchGroup(g) { activeGroup = g; renderWatchlist(); }
function changeGroup(sym, group) {
  const w = store.watchlist.find(w => w.sym === sym);
  if (w) { w.group = group; saveStore(); renderWatchlist(); }
}
function removeWatchlist(sym) {
  store.watchlist = store.watchlist.filter(w => w.sym !== sym);
  saveStore(); renderWatchlist();
  showToast('已移除');
}

// ==================== PORTFOLIO PAGE ====================
function renderPortfolio() {
  const body = document.getElementById('portfolioBody');
  const summary = document.getElementById('portfolioSummary');
  if (!store.portfolio.length) {
    body.innerHTML = `<tr><td colspan="8" class="loading-row">暂无持仓记录 — 点击"新增持仓"添加</td></tr>`;
    summary.innerHTML = '';
    return;
  }
  let totalCost = 0, totalMarket = 0;
  const rows = store.portfolio.map(p => {
    const d = getPrice(p.sym);
    const price = d ? d.price : p.costPrice;
    const marketVal = price * p.qty;
    const costVal = p.costPrice * p.qty;
    const pnl = marketVal - costVal;
    const pnlPct = (pnl / costVal) * 100;
    totalCost += costVal; totalMarket += marketVal;
    const sign = pnl >= 0 ? '+' : '';
    const cls = changeClass(pnl);
    return `<tr>
      <td><div class="stock-name">${p.name}</div><div class="stock-code">${p.sym}</div></td>
      <td class="r mono ${d ? changeClass(d.pct) : ''}">${fmt(price)}</td>
      <td class="r mono">${fmt(p.costPrice)}</td>
      <td class="r mono">${p.qty.toLocaleString()}</td>
      <td class="r mono">${fmt(marketVal, 2)}</td>
      <td class="r mono ${cls}">${sign}${fmt(pnl, 2)}</td>
      <td class="r"><span class="${pnl >= 0 ? 'tag-up' : 'tag-down'}">${sign}${pnlPct.toFixed(2)}%</span></td>
      <td class="r"><div class="stock-actions">
        <button class="btn-sm" onclick="editPosition('${p.sym}')">编辑</button>
        <button class="btn-sm danger" onclick="removePosition('${p.sym}')">删除</button>
      </div></td>
    </tr>`;
  });
  body.innerHTML = rows.join('');
  const totalPnl = totalMarket - totalCost;
  const totalPnlPct = totalCost ? (totalPnl / totalCost) * 100 : 0;
  const sign = totalPnl >= 0 ? '+' : '';
  summary.innerHTML = `
    <div class="summary-card"><div class="summary-label">持仓市值</div><div class="summary-value">${fmt(totalMarket, 2)}</div></div>
    <div class="summary-card"><div class="summary-label">持仓成本</div><div class="summary-value">${fmt(totalCost, 2)}</div></div>
    <div class="summary-card"><div class="summary-label">总盈亏</div><div class="summary-value ${changeClass(totalPnl)}">${sign}${fmt(totalPnl, 2)}</div></div>
    <div class="summary-card"><div class="summary-label">盈亏比例</div><div class="summary-value ${changeClass(totalPnl)}">${sign}${totalPnlPct.toFixed(2)}%</div></div>`;
}

function openAddPosition(sym) {
  const p = sym ? store.portfolio.find(x => x.sym === sym) : null;
  document.getElementById('modalTitle').textContent = p ? '编辑持仓' : '新增持仓';
  const syms = [...Object.keys(BASE_DATA)].map(s => `<option value="${s}" ${p && p.sym === s ? 'selected' : ''}>${BASE_DATA[s].name}（${s}）</option>`).join('');
  document.getElementById('modalBody').innerHTML = `
    <div class="form-row"><label class="form-label">股票/基金</label>
      <select class="form-input" id="mSym" ${p ? 'disabled' : ''}><option value="">-- 请选择 --</option>${syms}</select></div>
    <div class="form-row"><label class="form-label">买入均价</label>
      <input class="form-input" id="mCost" type="number" step="0.01" value="${p ? p.costPrice : ''}" placeholder="例如 189.30"></div>
    <div class="form-row"><label class="form-label">持仓数量（股/份）</label>
      <input class="form-input" id="mQty" type="number" step="1" value="${p ? p.qty : ''}" placeholder="例如 100"></div>`;
  document.getElementById('modalOverlay').classList.add('open');
  window._modalEditSym = p ? sym : null;
}
function editPosition(sym) { openAddPosition(sym); }
function removePosition(sym) {
  store.portfolio = store.portfolio.filter(p => p.sym !== sym);
  saveStore(); renderPortfolio(); showToast('已删除');
}
function saveModal() {
  const sym = window._modalEditSym || document.getElementById('mSym').value;
  const cost = parseFloat(document.getElementById('mCost').value);
  const qty = parseInt(document.getElementById('mQty').value);
  if (!sym || isNaN(cost) || isNaN(qty) || cost <= 0 || qty <= 0) { showToast('请填写完整信息'); return; }
  const d = BASE_DATA[sym];
  if (window._modalEditSym) {
    const p = store.portfolio.find(p => p.sym === sym);
    if (p) { p.costPrice = cost; p.qty = qty; }
  } else {
    if (store.portfolio.find(p => p.sym === sym)) { showToast('持仓中已有该标的'); return; }
    store.portfolio.push({ sym, name: d ? d.name : sym, costPrice: cost, qty, addedAt: Date.now() });
  }
  saveStore(); closeModal(); renderPortfolio();
  showToast('保存成功');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

// ==================== RANK PAGE ====================
function renderRank() {
  const el = document.getElementById('rankGrid');
  const cnSyms = ['SH600519','SH601318','SZ000858','SH600036','SZ300750','SH600900','SZ002714','SH000688'];
  const usSyms = ['AAPL','MSFT','NVDA','TSLA','GOOGL','META','AMZN'];
  const allCN = cnSyms.map(sym => ({ sym, ...getPrice(sym) })).sort((a,b) => b.pct - a.pct);
  const allUS = usSyms.map(sym => ({ sym, ...getPrice(sym) })).sort((a,b) => b.pct - a.pct);
  function rankList(title, items, isTop) {
    const sorted = isTop ? [...items].sort((a,b) => b.pct - a.pct) : [...items].sort((a,b) => a.pct - b.pct);
    const top5 = sorted.slice(0, 5);
    return `<div class="rank-list">
      <div class="rank-header">${title}</div>
      ${top5.map((d,i) => {
        const sign = d.pct >= 0 ? '+' : '';
        return `<div class="rank-item">
          <div class="rank-num">${i+1}</div>
          <div class="rank-info"><div class="rank-name">${d.name}</div><div class="rank-code">${d.sym}</div></div>
          <div class="rank-pct ${changeClass(d.pct)}">${sign}${d.pct.toFixed(2)}%</div>
        </div>`;
      }).join('')}
    </div>`;
  }
  el.innerHTML = rankList('🇨🇳 A股涨幅榜', allCN, true)
    + rankList('🇨🇳 A股跌幅榜', allCN, false)
    + rankList('🇺🇸 美股涨幅榜', allUS, true)
    + rankList('🇺🇸 美股跌幅榜', allUS, false);
}

// ==================== FX PAGE ====================
const FX_DATA = [
  { pair: 'USD/CNY', base: 7.2345, from: 'USD', to: 'CNY' },
  { pair: 'EUR/CNY', base: 7.8012, from: 'EUR', to: 'CNY' },
  { pair: 'HKD/CNY', base: 0.9258, from: 'HKD', to: 'CNY' },
  { pair: 'JPY/CNY', base: 0.0478, from: 'JPY', to: 'CNY' },
  { pair: 'GBP/CNY', base: 9.1434, from: 'GBP', to: 'CNY' },
  { pair: 'AUD/CNY', base: 4.7822, from: 'AUD', to: 'CNY' },
];
function renderFX() {
  const el = document.getElementById('fxGrid');
  const t = Math.floor(Date.now() / 60000);
  el.innerHTML = FX_DATA.map((fx, i) => {
    const r = seededRand('fx' + i, t);
    const rate = fx.base + (r - 0.5) * 0.01 * fx.base;
    const pct = (r - 0.5) * 0.6;
    const sign = pct >= 0 ? '+' : '';
    return `<div class="fx-card">
      <div class="fx-pair">${fx.pair}</div>
      <div class="fx-rate ${changeClass(pct)}">${rate.toFixed(fx.base < 1 ? 4 : 4)}</div>
      <div>${changeTag(pct, sign + pct.toFixed(3) + '%')}</div>
      <div class="fx-conv">
        <input class="fx-input" type="number" value="1000" id="fxIn${i}" oninput="calcFX(${i},${rate.toFixed(6)})" placeholder="${fx.from}">
        <span style="color:var(--text3);font-size:12px;">→</span>
        <span class="fx-result" id="fxOut${i}">${(1000 * rate).toFixed(2)} ${fx.to}</span>
      </div>
    </div>`;
  }).join('');
}
function calcFX(i, rate) {
  const v = parseFloat(document.getElementById('fxIn' + i).value);
  const pair = FX_DATA[i];
  document.getElementById('fxOut' + i).textContent = isNaN(v) ? '--' : (v * rate).toFixed(2) + ' ' + pair.to;
}

// ==================== NAVIGATION ====================
let currentPage = 'market';
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  event.currentTarget.classList.add('active');
  currentPage = page;
  renderCurrentPage();
}
function renderCurrentPage() {
  if (currentPage === 'market') renderMarket();
  else if (currentPage === 'watchlist') renderWatchlist();
  else if (currentPage === 'portfolio') renderPortfolio();
  else if (currentPage === 'rank') renderRank();
  else if (currentPage === 'fx') renderFX();
  updateTime();
}

// ==================== AUTO REFRESH ====================
let refreshTimer = null;
function setRefreshInterval() {
  clearInterval(refreshTimer);
  const s = parseInt(document.getElementById('refreshInterval').value);
  const dot = document.getElementById('refreshDot');
  if (s > 0) {
    dot.style.background = 'var(--up)';
    refreshTimer = setInterval(() => { renderCurrentPage(); }, s * 1000);
  } else {
    dot.style.background = 'var(--text3)';
  }
}
function updateTime() {
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-CN');
}

// ==================== TOAST ====================
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ==================== INIT ====================
renderMarket();
setRefreshInterval();
</script>
